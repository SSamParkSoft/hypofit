services:
  postgres:
    image: postgres:16-alpine
    container_name: hypofit-postgres
    environment:
      POSTGRES_DB: hypofit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hypofit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hypofit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hypofit_postgres_data:
