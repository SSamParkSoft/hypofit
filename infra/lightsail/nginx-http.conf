map_hash_bucket_size 128;
variables_hash_bucket_size 128;

map "$request_method:$uri" $hypofit_limit_social_attempts_key {
    default "";
    "POST:/api/v1/auth/social/attempts" $binary_remote_addr;
}

map "$request_method:$uri" $hypofit_limit_account_deletion_public_create_key {
    default "";
    "POST:/api/v1/account-deletion-requests/public" $binary_remote_addr;
}

map "$request_method:$uri" $hypofit_limit_account_deletion_public_resend_key {
    default "";
    "POST:/api/v1/account-deletion-requests/public/resend" $binary_remote_addr;
}

map "$request_method:$uri" $hypofit_limit_account_deletion_public_verify_key {
    default "";
    "POST:/api/v1/account-deletion-requests/public/verify" $binary_remote_addr;
}

map "$request_method:$uri" $hypofit_limit_account_deletion_public_confirm_key {
    default "";
    "POST:/api/v1/account-deletion-requests/public/confirm" $binary_remote_addr;
}

map "$request_method:$uri" $hypofit_limit_apple_notifications_key {
    default "";
    "POST:/api/v1/auth/social/apple/notifications" $binary_remote_addr;
}

limit_req_zone $hypofit_limit_social_attempts_key zone=hypofit_social_attempts:10m rate=20r/m;
limit_req_zone $hypofit_limit_account_deletion_public_create_key zone=hypofit_account_deletion_public_create:10m rate=5r/m;
limit_req_zone $hypofit_limit_account_deletion_public_resend_key zone=hypofit_account_deletion_public_resend:10m rate=3r/m;
limit_req_zone $hypofit_limit_account_deletion_public_verify_key zone=hypofit_account_deletion_public_verify:10m rate=12r/m;
limit_req_zone $hypofit_limit_account_deletion_public_confirm_key zone=hypofit_account_deletion_public_confirm:10m rate=5r/m;
limit_req_zone $hypofit_limit_apple_notifications_key zone=hypofit_apple_notifications:10m rate=30r/m;

upstream hypofit_spring_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name hypofit-api.bukae.co.kr 54.116.198.195;

    client_max_body_size 10m;
    limit_req_log_level warn;
    limit_req_status 429;
    error_page 429 = @hypofit_rate_limited_json;

    location = /actuator/prometheus {
        deny all;
    }

    location @hypofit_rate_limited_json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 60 always;
        return 429 '{"error":{"code":"request_rate_limited","message":"요청이 너무 많아요. 잠시 후 다시 시도해 주세요.","status":429}}';
    }

    location = /api/v1/service-status {
        # The application owns scheduled status while healthy. The static
        # document only takes over when the hard-maintenance flag is present.
        if (-f /opt/hypofit/status/maintenance.flag) {
            return 418;
        }

        error_page 418 = @hypofit_static_service_status;
        proxy_pass http://hypofit_spring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location @hypofit_static_service_status {
        internal;
        root /opt/hypofit/status;
        try_files /service-status.json =404;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }

    location = /health {
        proxy_pass http://hypofit_spring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/v1/health {
        proxy_pass http://hypofit_spring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /api/v1/health/ready {
        proxy_pass http://hypofit_spring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
    }

    location @hypofit_maintenance_json {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 300 always;
        return 503 '{"error":{"code":"maintenance_in_progress","message":"서비스 점검 중이에요. 잠시 후 다시 확인해 주세요.","status":503}}';
    }

    location / {
        if (-f /opt/hypofit/status/maintenance.flag) {
            return 418;
        }

        error_page 418 = @hypofit_maintenance_json;
        limit_req zone=hypofit_social_attempts burst=8 nodelay;
        limit_req zone=hypofit_account_deletion_public_create burst=2 nodelay;
        limit_req zone=hypofit_account_deletion_public_resend burst=2 nodelay;
        limit_req zone=hypofit_account_deletion_public_verify burst=6 nodelay;
        limit_req zone=hypofit_account_deletion_public_confirm burst=2 nodelay;
        limit_req zone=hypofit_apple_notifications burst=10 nodelay;
        proxy_pass http://hypofit_spring_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Keep the upstream budget below the mobile client's 20 s timeout so a
        # client-side retry cannot race a still-running synchronous mutation.
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
        add_header X-Content-Type-Options nosniff always;
    }
}
