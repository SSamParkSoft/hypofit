# Include inside the existing HTTPS server block. Keep Certbot TLS directives.
# Also add the following guard inside its existing `location /` block:
#   if (-f /opt/hypofit/status/maintenance.flag) { return 418; }
# Do not activate the flag until nginx -t and normal-mode checks have passed.

error_page 418 = @hypofit_maintenance_json;

location = /api/v1/service-status {
    if (-f /opt/hypofit/status/maintenance.flag) {
        return 418;
    }
    error_page 418 = @hypofit_static_service_status;
    proxy_pass http://hypofit_spring_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header Cache-Control "no-store" always;
}

location @hypofit_static_service_status {
    internal;
    root /opt/hypofit/status;
    try_files /service-status.json =404;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

location @hypofit_maintenance_json {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 300 always;
    return 503 '{"error":{"code":"maintenance_in_progress","message":"서비스 점검 중이에요. 잠시 후 다시 확인해 주세요.","status":503}}';
}

# Keep the deployment readiness path available without an Admin bypass.
location = /api/v1/health/ready {
    proxy_pass http://hypofit_spring_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    add_header Cache-Control "no-store" always;
}
